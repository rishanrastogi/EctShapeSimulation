<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECT Shape Viewer</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b24; --panel2: #1c2230; --border: #2a3344;
    --text: #dde3ee; --muted: #8b94a7; --accent: #4f8ff7;
    --truth: #3d8bfd; --recon: #e8923a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .banner {
    font-size: 11px; color: #f0b43c; border: 1px solid #5a4a1e;
    background: #2a2310; padding: 2px 8px; border-radius: 4px;
  }
  .tabs { display: flex; gap: 6px; margin-left: auto; }
  .tabs button {
    background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { flex: 1; display: flex; min-height: 0; }
  #left { flex: 1.1; position: relative; min-width: 0; border-right: 1px solid var(--border); }
  #canvas3d { width: 100%; height: 100%; display: block; }
  .overlay {
    position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 6px;
  }
  .overlay label {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
    background: rgba(22,27,36,.85); padding: 4px 8px; border-radius: 5px; cursor: pointer;
  }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .hint { position: absolute; bottom: 8px; left: 10px; font-size: 11px; color: var(--muted); }
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .metrics {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .metric { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .metric .k { font-size: 11px; color: var(--muted); }
  .metric .v { font-size: 17px; font-weight: 600; margin-top: 2px; }
  .chart-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px 0;
  }
  .chart-head select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; font-size: 13px;
  }
  .chart-head .legend { font-size: 12px; color: var(--muted); display: flex; gap: 14px; margin-left: auto; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  #chartWrap { flex: 1; min-height: 0; padding: 8px 14px 4px; position: relative; }
  #chart { width: 100%; height: 100%; display: block; cursor: crosshair; }
  #tooltip {
    position: absolute; pointer-events: none; display: none; z-index: 5;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 9px; font-size: 12px; white-space: pre; box-shadow: 0 4px 14px rgba(0,0,0,.5);
  }
  footer { padding: 6px 14px 10px; font-size: 11px; color: var(--muted); }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #left { border-right: none; border-bottom: 1px solid var(--border); min-height: 45vh; }
  }
</style>
</head>
<body>
<header>
  <h1>SpaceLab ECT Shape Viewer</h1>
  <span class="banner">SYNTHETIC DATA — mock forward model, not FDC1004 hardware</span>
  <nav class="tabs" id="tabs"></nav>
</header>
<main>
  <section id="left">
    <canvas id="canvas3d"></canvas>
    <div class="overlay">
      <label><input type="checkbox" id="cbTruth" checked><span class="swatch" style="background:var(--truth)"></span>Ground truth</label>
      <label><input type="checkbox" id="cbRecon" checked><span class="swatch" style="background:var(--recon)"></span>Reconstruction</label>
      <label><input type="checkbox" id="cbElec" checked><span class="swatch" style="background:#9aa4b8"></span>Electrodes</label>
      <label><input type="checkbox" id="cbCapsule" checked><span class="swatch" style="background:#39435a"></span>Capsule</label>
    </div>
    <div class="hint">drag to rotate · wheel to zoom · shift-drag to pan</div>
  </section>
  <section id="right">
    <div class="metrics" id="metrics"></div>
    <div class="chart-head">
      <select id="mode">
        <option value="measured">Measured vs baseline (fF)</option>
        <option value="delta">Δ Capacitance (fF)</option>
        <option value="normalized">Normalized measurement</option>
      </select>
      <div class="legend" id="legend"></div>
    </div>
    <div id="chartWrap">
      <canvas id="chart"></canvas>
      <div id="tooltip"></div>
    </div>
    <footer>
      Pairs sorted by index; shaded bands group pairs by ring combination. Averaged over
      <span id="nReps"></span> noisy repeats (σ = <span id="noise"></span> fF). Hover for pair details.
    </footer>
  </section>
</main>

<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
"use strict";
const D = ECT_DATA;
const shapeNames = Object.keys(D.shapes);
let current = shapeNames[0];

/* ---------------- tabs ---------------- */
const tabsEl = document.getElementById("tabs");
shapeNames.forEach(n => {
  const b = document.createElement("button");
  b.textContent = n.replace(/_/g, " ");
  b.onclick = () => { current = n; update(); };
  b.dataset.name = n;
  tabsEl.appendChild(b);
});

/* ---------------- three.js scene ---------------- */
const canvas = document.getElementById("canvas3d");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1117);
const camera = new THREE.PerspectiveCamera(45, 1, 1, 2000);

const R = D.config.radius_mm, H = D.config.height_mm;
// World group centered on capsule mid-height; z-up data -> rotate so y is up.
const world = new THREE.Group();
world.rotation.x = -Math.PI / 2;
world.position.y = 0;
scene.add(world);
const zShift = -H / 2; // center capsule vertically

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(1, 2, 1.5); scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4); fill.position.set(-2, -1, -1); scene.add(fill);

/* capsule cylinder + electrodes (static) */
const staticGroup = new THREE.Group(); world.add(staticGroup);
{
  const geo = new THREE.CylinderGeometry(R, R, H, 48, 1, true);
  const mat = new THREE.MeshPhongMaterial({
    color: 0x39435a, transparent: true, opacity: 0.14, side: THREE.DoubleSide, depthWrite: false
  });
  const cyl = new THREE.Mesh(geo, mat);
  cyl.rotation.x = Math.PI / 2;           // cylinder axis -> z (data frame)
  cyl.position.z = H / 2 + zShift;
  staticGroup.add(cyl);
  const edge = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.CylinderGeometry(R, R, H, 36, 1, true), 30),
    new THREE.LineBasicMaterial({ color: 0x39435a, transparent: true, opacity: 0.5 })
  );
  edge.rotation.x = Math.PI / 2; edge.position.z = H / 2 + zShift;
  staticGroup.add(edge);
}
const elecGroup = new THREE.Group(); world.add(elecGroup);
{
  const mat = new THREE.MeshPhongMaterial({ color: 0x9aa4b8 });
  D.electrodes.forEach(e => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(2.2, 6, 9), mat);
    m.position.set(e.center[0] * 1.02, e.center[1] * 1.02, e.center[2] + zShift);
    m.lookAt(0, 0, e.center[2] + zShift);
    elecGroup.add(m);
  });
}

/* shape meshes */
function buildMesh(data, color, opacity) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(data.vertices, 3));
  g.setIndex(data.faces);
  g.computeVertexNormals();
  const mat = new THREE.MeshPhongMaterial({
    color, transparent: opacity < 1, opacity, shininess: 40,
    side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(g, mat);
  mesh.position.z = zShift;
  return mesh;
}
let truthMesh = null, reconMesh = null;
function rebuildShapes() {
  if (truthMesh) { world.remove(truthMesh); truthMesh.geometry.dispose(); }
  if (reconMesh) { world.remove(reconMesh); reconMesh.geometry.dispose(); }
  truthMesh = reconMesh = null;
  const s = D.shapes[current];
  if (s.truthMesh) { truthMesh = buildMesh(s.truthMesh, 0x3d8bfd, 0.55); world.add(truthMesh); }
  if (s.reconMesh) { reconMesh = buildMesh(s.reconMesh, 0xe8923a, 0.9); world.add(reconMesh); }
  applyVisibility();
}
function applyVisibility() {
  if (truthMesh) truthMesh.visible = document.getElementById("cbTruth").checked;
  if (reconMesh) reconMesh.visible = document.getElementById("cbRecon").checked;
  elecGroup.visible = document.getElementById("cbElec").checked;
  staticGroup.visible = document.getElementById("cbCapsule").checked;
}
["cbTruth", "cbRecon", "cbElec", "cbCapsule"].forEach(id =>
  document.getElementById(id).addEventListener("change", applyVisibility));

/* simple orbit controls */
let theta = 0.6, phi = 1.15, dist = Math.max(R, H) * 3.2;
const target = new THREE.Vector3(0, 0, 0);
function placeCamera() {
  const sp = Math.sin(phi), cp = Math.cos(phi);
  camera.position.set(
    target.x + dist * sp * Math.sin(theta),
    target.y + dist * cp,
    target.z + dist * sp * Math.cos(theta)
  );
  camera.lookAt(target);
}
let dragging = false, panning = false, px = 0, py = 0;
canvas.addEventListener("pointerdown", e => {
  dragging = true; panning = e.shiftKey; px = e.clientX; py = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
  if (panning) {
    const scale = dist * 0.0015;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
    target.addScaledVector(right, -dx * scale).addScaledVector(up, dy * scale);
  } else {
    theta -= dx * 0.006;
    phi = Math.min(Math.PI - 0.05, Math.max(0.05, phi - dy * 0.006));
  }
  placeCamera();
});
canvas.addEventListener("pointerup", () => dragging = false);
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  dist = Math.min(2000, Math.max(20, dist * (1 + Math.sign(e.deltaY) * 0.1)));
  placeCamera();
}, { passive: false });

function resize3d() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * devicePixelRatio || canvas.height !== h * devicePixelRatio) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}
(function animate() {
  requestAnimationFrame(animate);
  resize3d();
  renderer.render(scene, camera);
})();
placeCamera();

/* ---------------- metrics ---------------- */
function renderMetrics() {
  const m = D.shapes[current].metrics;
  const cells = [
    ["IoU", m.iou.toFixed(3)],
    ["Volume error", (m.volErrPct > 0 ? "+" : "") + m.volErrPct.toFixed(1) + " %"],
    ["Truth / recon vol", m.volTrue_mL.toFixed(1) + " / " + m.volRecon_mL.toFixed(1) + " mL"],
    ["Mean surf. dist", m.msd_mm != null ? m.msd_mm.toFixed(2) + " mm" : "—"],
    ["Hausdorff dist", m.hausdorff_mm != null ? m.hausdorff_mm.toFixed(2) + " mm" : "—"],
    ["Pairs", D.pairs.length],
  ];
  document.getElementById("metrics").innerHTML = cells.map(
    ([k, v]) => `<div class="metric"><div class="k">${k}</div><div class="v">${v}</div></div>`
  ).join("");
}

/* ---------------- chart ---------------- */
const chart = document.getElementById("chart");
const ctx = chart.getContext("2d");
const tooltip = document.getElementById("tooltip");
const modeSel = document.getElementById("mode");
modeSel.addEventListener("change", drawChart);
let hoverIdx = -1;

function ringLabel(p) { return p.ringA === p.ringB ? `ring ${p.ringA}` : `rings ${p.ringA}–${p.ringB}`; }

function drawChart() {
  const wrap = document.getElementById("chartWrap");
  const w = wrap.clientWidth - 28, h = wrap.clientHeight - 12;
  chart.width = w * devicePixelRatio; chart.height = h * devicePixelRatio;
  chart.style.width = w + "px"; chart.style.height = h + "px";
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const mode = modeSel.value;
  const s = D.shapes[current];
  const main = mode === "measured" ? s.measured_fF
             : mode === "delta" ? s.measured_fF.map((v, i) => v - D.baseline_fF[i])
             : s.normalized;
  const ref = mode === "measured" ? D.baseline_fF : null;
  const n = main.length;

  const L = 52, Rm = 10, T = 10, B = 34;
  const pw = w - L - Rm, ph = h - T - B;
  let lo = Math.min(...main, ...(ref || [Infinity]));
  let hi = Math.max(...main, ...(ref || [-Infinity]));
  if (mode !== "measured") { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const X = i => L + (i + 0.5) / n * pw;
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * ph;

  // ring-combination bands
  let bandStart = 0;
  const bandKey = p => p.ringA + "-" + p.ringB;
  for (let i = 1; i <= n; i++) {
    if (i === n || bandKey(D.pairs[i]) !== bandKey(D.pairs[bandStart])) {
      const even = (parseInt(D.pairs[bandStart].ringA) + parseInt(D.pairs[bandStart].ringB)) % 2 === 0;
      ctx.fillStyle = even ? "rgba(255,255,255,0.025)" : "rgba(79,143,247,0.04)";
      ctx.fillRect(L + bandStart / n * pw, T, (i - bandStart) / n * pw, ph);
      bandStart = i;
    }
  }

  // axes + gridlines
  ctx.strokeStyle = "#2a3344"; ctx.fillStyle = "#8b94a7"; ctx.font = "10px sans-serif";
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  const ticks = 5;
  for (let t = 0; t <= ticks; t++) {
    const v = lo + (hi - lo) * t / ticks, y = Y(v);
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(w - Rm, y); ctx.stroke();
    ctx.fillText(v.toFixed(mode === "normalized" ? 2 : 1), L - 6, y);
  }
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let i = 0; i < n; i += Math.ceil(n / 10)) ctx.fillText(i, X(i), h - B + 8);
  ctx.fillText("electrode pair index", L + pw / 2, h - 14);

  // zero line for delta/normalized
  if (mode !== "measured" && lo < 0 && hi > 0) {
    ctx.strokeStyle = "#8b94a7"; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(w - Rm, Y(0)); ctx.stroke();
    ctx.setLineDash([]);
  }

  // repeats scatter (faint)
  if (mode === "measured") {
    ctx.fillStyle = "rgba(232,146,58,0.25)";
    s.repeats_fF.forEach(rep => {
      for (let i = 0; i < n; i++) { ctx.fillRect(X(i) - 0.7, Y(rep[i]) - 0.7, 1.4, 1.4); }
    });
  }

  // reference baseline
  if (ref) {
    ctx.strokeStyle = "#7d8aa5"; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < n; i++) i ? ctx.lineTo(X(i), Y(ref[i])) : ctx.moveTo(X(i), Y(ref[i]));
    ctx.stroke();
  }

  // main series
  ctx.strokeStyle = "#e8923a"; ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (let i = 0; i < n; i++) i ? ctx.lineTo(X(i), Y(main[i])) : ctx.moveTo(X(i), Y(main[i]));
  ctx.stroke();

  // hover marker
  if (hoverIdx >= 0 && hoverIdx < n) {
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath(); ctx.moveTo(X(hoverIdx), T); ctx.lineTo(X(hoverIdx), T + ph); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(X(hoverIdx), Y(main[hoverIdx]), 3, 0, 7); ctx.fill();
  }

  // legend
  const leg = [["#e8923a", mode === "measured" ? "measured (avg of repeats)" :
                mode === "delta" ? "measured − baseline" : "normalized g"]];
  if (ref) leg.push(["#7d8aa5", "empty baseline"]);
  document.getElementById("legend").innerHTML = leg.map(
    ([c, t]) => `<span><span class="swatch" style="background:${c}"></span>${t}</span>`
  ).join("");

  chart._geom = { L, pw, n, main, ref, mode };
}

chart.addEventListener("pointermove", e => {
  const g = chart._geom; if (!g) return;
  const rect = chart.getBoundingClientRect();
  const i = Math.floor((e.clientX - rect.left - g.L) / g.pw * g.n);
  if (i < 0 || i >= g.n) { hoverIdx = -1; tooltip.style.display = "none"; drawChart(); return; }
  if (i !== hoverIdx) { hoverIdx = i; drawChart(); }
  const p = D.pairs[i];
  const unit = g.mode === "normalized" ? "" : " fF";
  let txt = `pair ${i}: E${p.a} ↔ E${p.b} (${ringLabel(p)})\n` +
            `value: ${g.main[i].toFixed(3)}${unit}`;
  if (g.ref) txt += `\nbaseline: ${g.ref[i].toFixed(3)} fF`;
  tooltip.textContent = txt;
  tooltip.style.display = "block";
  const wrapRect = document.getElementById("chartWrap").getBoundingClientRect();
  tooltip.style.left = Math.min(e.clientX - wrapRect.left + 14, wrapRect.width - 180) + "px";
  tooltip.style.top = (e.clientY - wrapRect.top + 10) + "px";
});
chart.addEventListener("pointerleave", () => { hoverIdx = -1; tooltip.style.display = "none"; drawChart(); });
window.addEventListener("resize", drawChart);

/* ---------------- update ---------------- */
function update() {
  document.querySelectorAll(".tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.name === current));
  rebuildShapes();
  renderMetrics();
  hoverIdx = -1;
  drawChart();
}
document.getElementById("nReps").textContent = D.shapes[current].repeats_fF.length;
document.getElementById("noise").textContent = D.config.noise_fF;
update();
</script>
</body>
</html>
